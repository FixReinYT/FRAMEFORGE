name: Build FRAMEFORGE for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run regression tests
        run: |
          python -m compileall -q lucas_animator tests
          python -m unittest discover -s tests -v
      - name: Generate application icon
        run: python tools/create_icon.py
      - name: Create Windows version metadata
        shell: pwsh
        run: |
          @'
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(0, 11, 0, 0),
              prodvers=(0, 11, 0, 0),
              mask=0x3f,
              flags=0x0,
              OS=0x4,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable('040904B0', [
                  StringStruct('CompanyName', 'TheLucassDen'),
                  StringStruct('FileDescription', 'FRAMEFORGE - 2D Drawing and Animation Editor'),
                  StringStruct('FileVersion', '0.11.0.0'),
                  StringStruct('InternalName', 'FRAMEFORGE'),
                  StringStruct('LegalCopyright', 'Copyright (C) 2026 TheLucassDen. All rights reserved.'),
                  StringStruct('OriginalFilename', 'FRAMEFORGE.exe'),
                  StringStruct('ProductName', 'FRAMEFORGE'),
                  StringStruct('ProductVersion', '0.11.0')
                ])
              ]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          '@ | Set-Content -Path version_info.txt -Encoding utf8
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon assets/frameforge.ico --version-file version_info.txt --collect-all imageio_ffmpeg --add-data "assets/frameforge_icon.png;assets" --name FRAMEFORGE lucas_animator/app.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FRAMEFORGE-Windows
          path: dist/FRAMEFORGE.exe
          if-no-files-found: error
